# Builds the self-contained Windows package (bundled Node.js) and publishes it as a GitHub Release.
# Release: push a tag, e.g.  git tag v0.2.0 && git push origin v0.2.0
# Manual run (Actions tab): builds the ZIP as a downloadable artifact without publishing a release.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run typecheck

      - name: Build package
        run: npm run package:win
        env:
          RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

      - uses: actions/upload-artifact@v4
        with:
          name: AcroNote-win-x64
          path: release/*.zip

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = Get-ChildItem release/*.zip | Select-Object -First 1
          gh release create "${{ github.ref_name }}" $zip.FullName --title "AcroNote ${{ github.ref_name }}" --notes-file scripts/release/notes.md --generate-notes
