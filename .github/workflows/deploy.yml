# Deploys `main` to Fly.io after every merge. Requires the FLY_API_TOKEN repository secret
# (docs/DEPLOY.md); without it the job is skipped instead of failing.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip when Fly.io is not configured yet
        if: env.FLY_API_TOKEN == ''
        run: echo "::notice::FLY_API_TOKEN is not set - skipping deployment. See docs/DEPLOY.md."
      - uses: actions/setup-node@v4
        if: env.FLY_API_TOKEN != ''
        with:
          node-version: 24
          cache: npm
      - name: Test before deploying
        if: env.FLY_API_TOKEN != ''
        run: npm ci && npm test && npm run typecheck
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: env.FLY_API_TOKEN != ''
      # The server backs up the database itself on the first start of each new version, before
      # migrations run (see apps/api/src/backup.ts); Fly also snapshots the volume daily.
      - name: Deploy to Fly.io
        if: env.FLY_API_TOKEN != ''
        run: flyctl deploy --remote-only --ha=false --build-arg ACRONOTE_VERSION="$(node -p "require('./package.json').version")+${GITHUB_SHA::7}"
