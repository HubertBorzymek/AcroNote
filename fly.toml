app = "acronote"
primary_region = "fra"

[env]
  HOST = "0.0.0.0"
  PORT = "8080"
  DATABASE_PATH = "/data/acronote.db"
  ACRONOTE_BEHIND_PROXY = "1"
  ACRONOTE_DEMO = "0"

# SQLite lives on this volume, so the app must run on exactly one Machine.
[[mounts]]
  source = "acronote_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
